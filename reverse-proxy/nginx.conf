server {
    listen 80;

    location /api/quotes/ {
    proxy_pass https://api.mattgodfrey.xyz/api/;

    proxy_set_header Host api.mattgodfrey.xyz;
    proxy_ssl_server_name on;
    proxy_ssl_name api.mattgodfrey.xyz;
    }

    location /api/ {
        proxy_pass http://api:8080/;
    }

    location / {
        proxy_pass http://frontend:80;
    }
}
